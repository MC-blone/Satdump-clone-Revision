name: Build All

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt update

          sudo apt install -y \
            cmake \
            ninja-build \
            openjdk-17-jdk \
            wget \
            unzip \
            build-essential \
            git \
            python3-mako

      - name: Install Gradle 7.5
        shell: bash
        run: |
          set -e

          sudo rm -rf \
            /usr/bin/gradle \
            /usr/local/bin/gradle \
            /opt/gradle \
            /opt/gradle-7.5 \
            "$HOME/.gradle"

          wget -q \
            https://services.gradle.org/distributions/gradle-7.5-bin.zip \
            -O gradle.zip

          sudo mkdir -p /opt

          sudo unzip \
            -q \
            -o \
            gradle.zip \
            -d /opt

          echo "/opt/gradle-7.5/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle-7.5/bin:$PATH"

          gradle --version

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"

          wget \
            --quiet \
            --output-document=android-sdk.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip

          rm -rf "$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME"

          unzip \
            -qq \
            android-sdk.zip \
            -d "$ANDROID_HOME"

          echo "===== SDK Manager ====="

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --version

          echo "===== Accept licenses ====="

          set +o pipefail

          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          set -o pipefail

          echo "===== Install platform tools ====="

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools"

          echo "Android SDK ready"

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install "ndk;25.2.9519653" \
            --channel=3

          test -d \
            "$ANDROID_HOME/ndk/25.2.9519653"

          echo "NDK installed"

      - name: Initialize submodules
        shell: bash
        run: |
          set -e

          git submodule update --init --recursive

      - name: Patch build dependencies
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          cd "$GITHUB_WORKSPACE/android/deps"

          if [ -f build.sh ]; then

            sed -i \
              's#https://github.com/R1NC/sqlite#https://github.com/sqlite/sqlite#g' \
              build.sh || true

            sed -i \
              's/-DNNG_TOOLS=OFF -DNNG_TESTS=OFF -DNNG_ENABLE_NNGCAT=OFF//g' \
              build.sh || true

            sed -i \
              's/for abi in armeabi-v7a arm64-v8a x86 x86_64/for abi in arm64-v8a/g' \
              build.sh || true

          fi

          echo "===== build.sh ====="

          sed -n '1,350p' build.sh || true

      - name: Build native dependencies
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          cd "$GITHUB_WORKSPACE/android/deps"

          chmod +x build.sh

          sh build.sh

      - name: Build SQLite
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          export OUTPUT_DIR="$GITHUB_WORKSPACE/android/deps/output/arm64-v8a"

          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

          mkdir -p "$OUTPUT_DIR/lib"
          mkdir -p "$OUTPUT_DIR/include"

          if [ -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then
            echo "SQLite already exists"
            ls -lh "$OUTPUT_DIR/lib/libsqlite3.a"
            exit 0
          fi

          cd "$GITHUB_WORKSPACE/android/deps"

          rm -rf sqlite-build

          mkdir -p sqlite-build

          cd sqlite-build

          wget -q \
            https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz \
            -O sqlite.tar.gz

          tar -xzf sqlite.tar.gz

          SQLITE_DIR=""

          for d in sqlite-autoconf-*; do
            if [ -d "$d" ]; then
              SQLITE_DIR="$d"
              break
            fi
          done

          test -n "$SQLITE_DIR"

          cd "$SQLITE_DIR"

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$OUTPUT_DIR" \
            --disable-shared \
            --enable-static \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC"

          make -j"$(nproc)"

          make install

          test -f "$OUTPUT_DIR/lib/libsqlite3.a"

          echo "SQLite OK"

          ls -lh \
            "$OUTPUT_DIR/lib/libsqlite3.a"

      - name: Verify native dependencies
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$GITHUB_WORKSPACE/android/deps/output/arm64-v8a"

          echo "===== Libraries ====="

          for lib in \
            libsqlite3.a \
            libvolk.a \
            libnng.a
          do

            if [ -f "$OUTPUT_DIR/lib/$lib" ]; then
              echo "FOUND $lib"
              ls -lh "$OUTPUT_DIR/lib/$lib"
            else
              echo "MISSING $lib"
            fi

          done

      - name: Fix FY4 Android compilation
        shell: bash
        run: |
          set -e

          FILE="$GITHUB_WORKSPACE/plugins/fengyun4_support/fy4/module_fy4_lrit_data_decoder.cpp"

          HEADER="$GITHUB_WORKSPACE/plugins/fengyun4_support/fy4/module_fy4_lrit_data_decoder.h"

          echo "========================================"
          echo "Fix FY4 Android source"
          echo "========================================"

          test -f "$FILE"

          echo "===== Relevant source ====="

          sed -n '120,175p' "$FILE"

          sed -n '225,260p' "$FILE"

          echo "========================================"

          echo "===== Search show_key_input ====="

          grep -Rni \
            "show_key_input" \
            "$GITHUB_WORKSPACE/plugins/fengyun4_support" \
            || true

          echo "========================================"

          echo "===== Check includes ====="

          head -40 "$FILE"

          echo "========================================"

          #
          # Fix std::this_thread::sleep_for
          #

          if ! grep -q '#include <thread>' "$FILE"; then

            sed -i '1i#include <thread>' "$FILE"

            echo "Added <thread>"

          fi

          if ! grep -q '#include <chrono>' "$FILE"; then

            sed -i '1i#include <chrono>' "$FILE"

            echo "Added <chrono>"

          fi

          #
          # show_key_input
          #
          # The current Android build references this variable
          # without a declaration.
          #
          # Add a local boolean if it is not already declared.
          #

          if ! grep -Eq \
            'bool[[:space:]]+show_key_input|std::atomic.*show_key_input' \
            "$FILE"; then

            echo "show_key_input declaration not found"

            python3 - "$FILE" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    data = f.read()

needle = "#include <thread>"

if needle in data:
    data = data.replace(
        needle,
        needle + "\n\nstatic bool show_key_input = false;\n",
        1
    )
else:
    data = (
        "#include <thread>\n"
        "#include <chrono>\n"
        "\n"
        "static bool show_key_input = false;\n"
        "\n"
        + data
    )

with open(path, "w", encoding="utf-8") as f:
    f.write(data)
PY

          fi

          echo "========================================"
          echo "===== Patched source ====="
          echo "========================================"

          head -35 "$FILE"

          grep -n \
            "show_key_input\|sleep_for" \
            "$FILE" \
            || true

      - name: Check FY4 source compilation
        shell: bash
        run: |
          set -e

          FILE="$GITHUB_WORKSPACE/plugins/fengyun4_support/fy4/module_fy4_lrit_data_decoder.cpp"

          echo "===== Final FY4 checks ====="

          grep -n \
            "show_key_input" \
            "$FILE" \
            || true

          grep -n \
            "sleep_for" \
            "$FILE" \
            || true

          grep -n \
            "#include <thread>" \
            "$FILE" \
            || true

          grep -n \
            "#include <chrono>" \
            "$FILE" \
            || true

      - name: Clean Android native build
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/android"

          rm -rf \
            app/.cxx \
            app/build

          rm -rf \
            .cxx

          echo "Android native build cache cleaned"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          export PATH="/opt/gradle-7.5/bin:$JAVA_HOME/bin:$PATH"

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          cd "$GITHUB_WORKSPACE/android"

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

          echo "========================================"
          echo "Gradle"
          echo "========================================"

          gradle --version

          echo "========================================"
          echo "Build"
          echo "========================================"

          gradle \
            assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/android/build.log"

      - name: Extract build errors
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "REAL BUILD ERRORS"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/android/build.log" ]; then

            echo "===== error: ====="

            grep -nEi \
              "error:" \
              "$GITHUB_WORKSPACE/android/build.log" \
              | tail -100 \
              || true

            echo
            echo "===== FAILED: ====="

            grep -nEi \
              "FAILED:" \
              "$GITHUB_WORKSPACE/android/build.log" \
              | tail -100 \
              || true

            echo
            echo "===== undefined reference ====="

            grep -nEi \
              "undefined reference|undefined symbol" \
              "$GITHUB_WORKSPACE/android/build.log" \
              | tail -100 \
              || true

            echo
            echo "===== linker ====="

            grep -nEi \
              "ld\.lld|clang.*error|fatal error" \
              "$GITHUB_WORKSPACE/android/build.log" \
              | tail -100 \
              || true

            echo
            echo "===== Last 500 lines ====="

            tail -500 \
              "$GITHUB_WORKSPACE/android/build.log"

          fi

          echo
          echo "========================================"
          echo "CMake/Ninja files"
          echo "========================================"

          find \
            "$GITHUB_WORKSPACE/android/app/.cxx" \
            -type f \
            \( \
              -name "*.ninja" \
              -o \
              -name "CMakeError.log" \
              -o \
              -name "CMakeOutput.log" \
            \) \
            -print \
            2>/dev/null \
            || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            ${{ github.workspace }}/android/build.log
          if-no-files-found: ignore

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK not found"

            find \
              "$GITHUB_WORKSPACE/android/app/build/outputs" \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo "========================================"
          echo "APK SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-debug.apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error