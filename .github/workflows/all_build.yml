name: Build All

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt install -y cmake ninja-build openjdk-17-jdk wget unzip build-essential git python3-mako

      - name: Install Gradle 7.5
        run: |
          sudo apt remove --purge -y gradle || true
          sudo apt autoremove -y || true
          sudo rm -rf /usr/bin/gradle /usr/local/bin/gradle /opt/gradle ~/.gradle
          wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
          sudo unzip -d /opt/gradle gradle-7.5-bin.zip
          echo "export PATH=/opt/gradle/gradle-7.5/bin:$PATH" >> $GITHUB_PATH
          export PATH=/opt/gradle/gradle-7.5/bin:$PATH
          gradle --version

      - name: Install Android SDK
        run: wget --quiet --output-document=android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip && mkdir android-sdk-linux && unzip -qq android-sdk.zip -d android-sdk-linux && export ANDROID_HOME=./android-sdk-linux && echo y | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk-linux --update && (echo y; echo y; echo y; echo y; echo y; echo y; echo y; echo y) | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk-linux --licenses

      - name: Install Android NDK
        run: $GITHUB_WORKSPACE/android-sdk-linux/cmdline-tools/bin/sdkmanager --sdk_root=$GITHUB_WORKSPACE/android-sdk-linux --install "ndk;25.2.9519653" --channel=3

      - name: Fix build.sh and build dependencies
        shell: bash
        run: |
          # ⭐ 关键：先初始化子模块，拉取 android/deps 内容
          git submodule update --init
          
          cd $GITHUB_WORKSPACE/android/deps
          
          # 修复 sqlite 编译参数（移除错误的 NNG 参数）
          sed -i 's/-DNNG_TOOLS=OFF -DNNG_TESTS=OFF -DNNG_ENABLE_NNGCAT=OFF//g' build.sh
          
          # 修复 hdf5 标签（2.0.0 不存在，改成 hdf5-1_14_3）
          sed -i 's/2.0.0/hdf5-1_14_3/g' build.sh
          
          # 修复 volk 子模块问题（在 build_volk 前添加子模块初始化）
          sed -i '/build_volk armeabi-v7a/i\  cd volk && git submodule update --init && cd ..' build.sh
          
          echo "build.sh 已修复，开始编译依赖..."
          
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk-linux
          sh build.sh

      - name: Build
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=/opt/gradle/gradle-7.5/bin:$JAVA_HOME/bin:$PATH
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk-linux
          cd $GITHUB_WORKSPACE/android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-debug.apk
          path: ${{runner.workspace}}/SatDump/android/app/build/outputs/apk/debug/app-debug.apk