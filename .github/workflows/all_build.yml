      - name: Build SQLite library
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"
          export OUTPUT_DIR="$GITHUB_WORKSPACE/android/deps/output/arm64-v8a"

          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"

          mkdir -p "$OUTPUT_DIR/lib"
          mkdir -p "$OUTPUT_DIR/include"

          echo "======================================"
          echo "SQLite Android build"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$NDK"
          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "CC=$CC"
          echo "OUTPUT_DIR=$OUTPUT_DIR"

          if [ -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then
            echo "SQLite library already exists"

            ls -lh \
              "$OUTPUT_DIR/lib/libsqlite3.a"

            exit 0
          fi

          cd "$GITHUB_WORKSPACE/android/deps"

          rm -rf sqlite-build
          mkdir -p sqlite-build

          cd sqlite-build

          echo "===== Download SQLite ====="

          wget -q \
            https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz \
            -O sqlite.tar.gz

          echo "===== Extract SQLite ====="

          tar -xzf sqlite.tar.gz

          SQLITE_DIR="$(find . -maxdepth 1 -type d -name 'sqlite-autoconf-*' | head -n 1)"

          if [ -z "$SQLITE_DIR" ]; then
            echo "ERROR: SQLite source directory not found"
            exit 1
          fi

          cd "$SQLITE_DIR"

          echo "SQLite source:"
          pwd

          echo "===== SQLite version ====="

          grep \
            '#define SQLITE_VERSION' \
            sqlite3.h \
            | head -n 1 || true

          echo "======================================"
          echo "Configure SQLite for Android"
          echo "======================================"

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$OUTPUT_DIR" \
            --disable-shared \
            --enable-static \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="-O2 -fPIC" \
            LDFLAGS=""

          echo "======================================"
          echo "Build SQLite"
          echo "======================================"

          make -j"$(nproc)"

          echo "======================================"
          echo "Install SQLite"
          echo "======================================"

          make install

          cd "$GITHUB_WORKSPACE"

          echo "======================================"
          echo "Locate SQLite library"
          echo "======================================"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.a" \
            -print

          if [ ! -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then

            SQLITE_LIB="$(
              find "$GITHUB_WORKSPACE/android/deps/sqlite-build" \
                -type f \
                -name "libsqlite3.a" \
                -print \
                | head -n 1
            )"

            if [ -n "$SQLITE_LIB" ]; then

              echo "Found:"
              echo "$SQLITE_LIB"

              cp -v \
                "$SQLITE_LIB" \
                "$OUTPUT_DIR/lib/libsqlite3.a"

            fi
          fi

          if [ ! -f "$OUTPUT_DIR/include/sqlite3.h" ]; then

            SQLITE_HEADER="$(
              find "$GITHUB_WORKSPACE/android/deps/sqlite-build" \
                -type f \
                -name "sqlite3.h" \
                -print \
                | head -n 1
            )"

            if [ -n "$SQLITE_HEADER" ]; then

              echo "Found SQLite header:"
              echo "$SQLITE_HEADER"

              cp -v \
                "$SQLITE_HEADER" \
                "$OUTPUT_DIR/include/sqlite3.h"

            fi
          fi

          if [ ! -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then

            echo "ERROR: Failed to build SQLite library"

            echo "===== SQLite build files ====="

            find "$GITHUB_WORKSPACE/android/deps/sqlite-build" \
              -maxdepth 5 \
              -type f \
              -print | head -300 || true

            echo "===== Output directory ====="

            find "$OUTPUT_DIR" \
              -maxdepth 5 \
              -type f \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "SQLite built successfully"
          echo "======================================"

          ls -lh \
            "$OUTPUT_DIR/lib/libsqlite3.a"

          if [ -f "$OUTPUT_DIR/include/sqlite3.h" ]; then
            ls -lh \
              "$OUTPUT_DIR/include/sqlite3.h"
          fi