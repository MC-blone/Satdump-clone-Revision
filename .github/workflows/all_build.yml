name: Build All

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            openjdk-17-jdk \
            wget \
            unzip \
            build-essential \
            git \
            python3-mako

      - name: Install Gradle 7.5
        shell: bash
        run: |
          set -e

          sudo rm -rf /opt/gradle
          sudo rm -rf "$HOME/.gradle"

          wget -q \
            https://services.gradle.org/distributions/gradle-7.5-bin.zip \
            -O gradle.zip

          sudo unzip -q -o gradle.zip -d /opt

          echo "/opt/gradle-7.5/bin" >> "$GITHUB_PATH"

          export PATH="/opt/gradle-7.5/bin:$PATH"

          gradle --version

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"

          rm -rf "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip \
            -O android-sdk.zip

          unzip -q android-sdk.zip -d "$ANDROID_HOME"

          echo "===== SDKMANAGER ====="

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --version

          echo "===== ACCEPT LICENSES ====="

          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses
          true
          set -o pipefail

          echo "===== INSTALL SDK ====="

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "===== VERIFY SDK ====="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK OK"

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"

          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install "ndk;25.2.9519653" \
            --channel=3

          test -d "$ANDROID_HOME/ndk/25.2.9519653"

          echo "NDK OK"

      - name: Initialize submodules
        shell: bash
        run: |
          set -e

          git submodule update --init --recursive

      - name: Prepare dependency build
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/android/deps"

          if [ -f build.sh ]; then
            sed -i \
              's#https://github.com/R1NC/sqlite#https://github.com/sqlite/sqlite#g' \
              build.sh || true

            sed -i \
              's/-DNNG_TOOLS=OFF -DNNG_TESTS=OFF -DNNG_ENABLE_NNGCAT=OFF//g' \
              build.sh || true

            sed -i \
              's/for abi in armeabi-v7a arm64-v8a x86 x86_64/for abi in arm64-v8a/g' \
              build.sh || true
          fi

          chmod +x build.sh

          echo "===== build.sh ====="

          sed -n '1,350p' build.sh

      - name: Build native dependencies
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          cd "$GITHUB_WORKSPACE/android/deps"

          ./build.sh

      - name: Build SQLite
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          export OUTPUT_DIR="$GITHUB_WORKSPACE/android/deps/output/arm64-v8a"

          mkdir -p "$OUTPUT_DIR/lib"
          mkdir -p "$OUTPUT_DIR/include"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$NDK"
          echo "OUTPUT_DIR=$OUTPUT_DIR"

          if [ -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then
            echo "SQLite already exists"
            ls -lh "$OUTPUT_DIR/lib/libsqlite3.a"
            exit 0
          fi

          cd "$GITHUB_WORKSPACE/android/deps"

          rm -rf sqlite-build
          mkdir -p sqlite-build
          cd sqlite-build

          echo "===== Download SQLite ====="

          wget -q \
            https://www.sqlite.org/2026/sqlite-autoconf-3530400.tar.gz \
            -O sqlite.tar.gz

          tar -xzf sqlite.tar.gz

          SQLITE_DIR="$(find . -maxdepth 1 -type d -name 'sqlite-autoconf-*' | head -n 1)"

          if [ -z "$SQLITE_DIR" ]; then
            echo "ERROR: SQLite source not found"
            exit 1
          fi

          cd "$SQLITE_DIR"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

          echo "CC=$CC"
          echo "CXX=$CXX"

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$OUTPUT_DIR" \
            --disable-shared \
            --enable-static \
            CFLAGS="-O2 -fPIC"

          make -j"$(nproc)"

          make install

          if [ ! -f "$OUTPUT_DIR/lib/libsqlite3.a" ]; then
            echo "ERROR: SQLite library was not produced"
            exit 1
          fi

          echo "SQLite OK"

          ls -lh "$OUTPUT_DIR/lib/libsqlite3.a"

      - name: Verify dependencies
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="$GITHUB_WORKSPACE/android/deps/output/arm64-v8a"

          echo "===== VERIFY DEPENDENCIES ====="

          for lib in libsqlite3.a libvolk.a libnng.a; do
            if [ -f "$OUTPUT_DIR/lib/$lib" ]; then
              echo "FOUND: $lib"
              ls -lh "$OUTPUT_DIR/lib/$lib"
            else
              echo "MISSING: $lib"
            fi
          done

      - name: Clean Android CMake
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/android"

          rm -rf app/.cxx
          rm -rf app/build
          rm -rf .cxx

          echo "Android CMake cache cleaned"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="/opt/gradle-7.5/bin:$JAVA_HOME/bin:$PATH"

          export ANDROID_HOME="$GITHUB_WORKSPACE/android-sdk-linux"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export NDK="$ANDROID_HOME/ndk/25.2.9519653"

          cd "$GITHUB_WORKSPACE/android"

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK=$NDK"

          echo "===== BUILD ====="

          gradle \
            assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/android/build.log"

      - name: Extract native build errors
        if: failure()
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/android/build.log"

          echo "========================================"
          echo "NATIVE BUILD ERROR ANALYSIS"
          echo "========================================"

          if [ ! -f "$LOG" ]; then
            echo "build.log not found"
            exit 0
          fi

          echo
          echo "===== ERROR ====="

          grep -nEi \
            'error:|fatal error:' \
            "$LOG" \
            | tail -200 \
            || true

          echo
          echo "===== FAILED ====="

          grep -nEi \
            'FAILED:' \
            "$LOG" \
            | tail -200 \
            || true

          echo
          echo "===== LINKER ====="

          grep -nEi \
            'undefined reference|undefined symbol|ld.lld' \
            "$LOG" \
            | tail -200 \
            || true

          echo
          echo "===== NINJA ====="

          grep -nEi \
            'ninja:|ninja.*error|subcommand failed' \
            "$LOG" \
            | tail -200 \
            || true

          echo
          echo "===== LAST 500 LINES ====="

          tail -500 "$LOG"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ${{ github.workspace }}/android/build.log
          if-no-files-found: ignore

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"

            find \
              "$GITHUB_WORKSPACE/android/app/build/outputs" \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo "===== APK ====="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-debug.apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error